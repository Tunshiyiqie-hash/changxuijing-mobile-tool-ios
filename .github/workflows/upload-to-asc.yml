name: Upload to App Store Connect

on:
  workflow_dispatch:

jobs:
  build-upload:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build, sign and upload
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_KEY_ISSUER_ID: ${{ secrets.ASC_KEY_ISSUER_ID }}
        ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
      run: |
        set -x
        KEYPATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
        echo "$ASC_KEY_P8_BASE64" | base64 -D -o "$KEYPATH"
        xcodebuild \
          -project "MobileTool.xcodeproj" \
          -scheme "MobileTool" \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath build/MobileTool.xcarchive \
          -allowProvisioningUpdates \
          -authenticationKeyPath "$KEYPATH" \
          -authenticationKeyID "$ASC_KEY_ID" \
          -authenticationKeyIssuerID "$ASC_KEY_ISSUER_ID" \
          archive
        cat > ExportOptions.plist <<'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key><string>app-store</string>
          <key>teamID</key><string>4H644473LJ</string>
          <key>uploadBitcode</key><false/>
          <key>uploadSymbols</key><true/>
          <key>signingStyle</key><string>automatic</string>
        </dict>
        </plist>
        EOF
        xcodebuild -exportArchive \
          -archivePath build/MobileTool.xcarchive \
          -exportPath export \
          -exportOptionsPlist ExportOptions.plist \
          -allowProvisioningUpdates \
          -authenticationKeyPath "$KEYPATH" \
          -authenticationKeyID "$ASC_KEY_ID" \
          -authenticationKeyIssuerID "$ASC_KEY_ISSUER_ID"
        IPA=$(find export -name "*.ipa" | head -1)
        echo "exported: $IPA"
        TRANS=""
        for c in \
          /usr/local/itms/bin/iTMSTransporter \
          /Applications/Xcode.app/Contents/SharedFrameworks/ContentDeliveryServices.framework/Versions/A/itms/bin/iTMSTransporter; do
          if [ -x "$c" ]; then TRANS="$c"; break; fi
        done
        "$TRANS" -m upload -assetFile "$IPA" -u "$APPLE_ID" -p "$APP_SPECIFIC_PASSWORD" -v eXtreme
