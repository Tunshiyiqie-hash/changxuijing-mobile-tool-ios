name: Upload to App Store Connect

on:
  workflow_dispatch:

jobs:
  build-upload:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Set up App Store Connect API key
      env:
        ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      run: |
        echo "$ASC_KEY_P8_BASE64" | base64 -D -o "$RUNNER_TEMP/AuthKey.p8"

    - name: Archive (automatic signing)
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_KEY_ISSUER_ID: ${{ secrets.ASC_KEY_ISSUER_ID }}
      run: |
        set -x
        xcodebuild \
          -project "MobileTool.xcodeproj" \
          -scheme "MobileTool" \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath build/MobileTool.xcarchive \
          -allowProvisioningUpdates \
          -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
          -authenticationKeyID "$ASC_KEY_ID" \
          -authenticationKeyIssuerID "$ASC_KEY_ISSUER_ID" \
          DEVELOPMENT_TEAM=4H644473LJ \
          archive

    - name: Merge custom Info.plist keys
      run: |
        set -e
        APP_PATH=$(find build/MobileTool.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
        python3 scripts/merge_plist.py InfoSources/MobileTool-Info.plist "$APP_PATH/Info.plist" \
          MobileTool com.changxujing.mobiletool MobileTool MobileTool 1.1.0 1
        python3 scripts/merge_plist.py InfoSources/BroadcastExtension-Info.plist "$APP_PATH/PlugIns/MobileToolBroadcast.appex/Info.plist" \
          MobileToolBroadcast com.changxujing.mobiletool.broadcast MobileToolBroadcast MobileToolBroadcast 1.1.0 1
        plutil -lint "$APP_PATH/Info.plist"
        plutil -lint "$APP_PATH/PlugIns/MobileToolBroadcast.appex/Info.plist"

    - name: Fix archive top-level metadata
      run: |
        python3 scripts/fix_archive.py build/MobileTool.xcarchive 1.1.0 1

    - name: Export archive (app-store)
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_KEY_ISSUER_ID: ${{ secrets.ASC_KEY_ISSUER_ID }}
      run: |
        cat > ExportOptions.plist <<'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key><string>app-store-connect</string>
          <key>teamID</key><string>4H644473LJ</string>
          <key>uploadBitcode</key><false/>
          <key>uploadSymbols</key><true/>
          <key>signingStyle</key><string>automatic</string>
        </dict>
        </plist>
        EOF
        xcodebuild -exportArchive \
          -archivePath build/MobileTool.xcarchive \
          -exportPath export \
          -exportOptionsPlist ExportOptions.plist \
          -allowProvisioningUpdates \
          -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
          -authenticationKeyID "$ASC_KEY_ID" \
          -authenticationKeyIssuerID "$ASC_KEY_ISSUER_ID"

    - name: Verify final IPA
      run: |
        IPA=$(find export -name "*.ipa" | head -1)
        echo "exported: $IPA"
        python3 scripts/verify_ipa.py "$IPA" 1.1.0 1

    - name: Upload to App Store Connect
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
      run: |
        IPA=$(find export -name "*.ipa" | head -1)
        echo "uploading: $IPA"
        # 查找真实的 iTMSTransporter（排除 Developer/usr/bin 下仅提示安装 Transporter 的占位程序）
        REAL_TRANS=$(find /Applications/Xcode*.app -type f -name iTMSTransporter 2>/dev/null | grep -v "/Developer/usr/bin/" | head -1 || true)
        echo "real iTMSTransporter: $REAL_TRANS"
        if [ -n "$REAL_TRANS" ]; then
          "$REAL_TRANS" -m upload -assetFile "$IPA" -u "$APPLE_ID" -p "$APP_SPECIFIC_PASSWORD" -v eXtreme
        else
          echo "using altool"
          xcrun altool --upload-app --type ios -f "$IPA" -u "$APPLE_ID" -p "$APP_SPECIFIC_PASSWORD"
        fi
