name: Get Distribution Cert Fingerprint

on:
  workflow_dispatch:

jobs:
  get-cert:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Set up App Store Connect API key
      env:
        ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      run: |
        echo "$ASC_KEY_P8_BASE64" | base64 -D -o "$RUNNER_TEMP/AuthKey.p8"

    - name: Archive (automatic signing installs distribution cert)
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_KEY_ISSUER_ID: ${{ secrets.ASC_KEY_ISSUER_ID }}
      run: |
        xcodebuild \
          -project "MobileTool.xcodeproj" \
          -scheme "MobileTool" \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath build/MobileTool.xcarchive \
          -allowProvisioningUpdates \
          -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
          -authenticationKeyID "$ASC_KEY_ID" \
          -authenticationKeyIssuerID "$ASC_KEY_ISSUER_ID" \
          DEVELOPMENT_TEAM=4H644473LJ \
          archive

    - name: Export archive (creates/uses Apple Distribution cert)
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_KEY_ISSUER_ID: ${{ secrets.ASC_KEY_ISSUER_ID }}
      run: |
        cat > ExportOptions.plist <<'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key><string>app-store-connect</string>
          <key>teamID</key><string>4H644473LJ</string>
          <key>uploadBitcode</key><false/>
          <key>uploadSymbols</key><true/>
          <key>signingStyle</key><string>automatic</string>
        </dict>
        </plist>
        EOF
        xcodebuild -exportArchive \
          -archivePath build/MobileTool.xcarchive \
          -exportPath export \
          -exportOptionsPlist ExportOptions.plist \
          -allowProvisioningUpdates \
          -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
          -authenticationKeyID "$ASC_KEY_ID" \
          -authenticationKeyIssuerID "$ASC_KEY_ISSUER_ID"

    - name: Print signing certificate SHA-1 and public key
      run: |
        echo "===== codesigning identities ====="
        security find-identity -v -p codesigning
        echo "===== export signing cert as PEM ====="
        security find-certificate -c "Apple Development: Created via API" -p > /tmp/ios_cert.pem
        cat /tmp/ios_cert.pem
        echo "===== cert modulus (public key, hex) ====="
        openssl x509 -in /tmp/ios_cert.pem -noout -modulus
        echo "===== cert fingerprint SHA-1 ====="
        openssl x509 -in /tmp/ios_cert.pem -noout -fingerprint -sha1
