name: Get Distribution Cert Fingerprint

on:
  workflow_dispatch:

jobs:
  get-cert:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Set up App Store Connect API key
      env:
        ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      run: |
        echo "$ASC_KEY_P8_BASE64" | base64 -D -o "$RUNNER_TEMP/AuthKey.p8"

    - name: Archive (automatic signing installs distribution cert)
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_KEY_ISSUER_ID: ${{ secrets.ASC_KEY_ISSUER_ID }}
      run: |
        xcodebuild \
          -project "MobileTool.xcodeproj" \
          -scheme "MobileTool" \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath build/MobileTool.xcarchive \
          -allowProvisioningUpdates \
          -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
          -authenticationKeyID "$ASC_KEY_ID" \
          -authenticationKeyIssuerID "$ASC_KEY_ISSUER_ID" \
          DEVELOPMENT_TEAM=4H644473LJ \
          archive

    - name: Print Apple Distribution certificate SHA-1
      run: |
        echo "===== Apple Distribution certs (find-certificate -Z) ====="
        security find-certificate -a -c "Apple Distribution" -Z
        echo "===== codesigning identities ====="
        security find-identity -v -p codesigning
